<!doctype html>
<html><head><title>Fixture Co - Apply</title></head>
<body>
<!-- Shaped like join.com (2026-09-28): one page, steps swapped in place with
     history.pushState: "Upload your CV", then "Upload your cover letter".
     Each step is only an upload box that accepts drops. -->
<h1 id="h">Upload your CV</h1>
<div id="box" style="border:1px dashed #999;padding:40px;width:400px">
  <p>Upload file</p>
  <p>Click to browse, or drag &amp; drop a file here.</p>
</div>
<p id="uploaded"></p>
<button id="continue" type="button">Continue</button>
<script>
  const got = {};
  const box = document.getElementById("box");
  box.addEventListener("dragover", (e) => e.preventDefault());
  box.addEventListener("drop", (e) => {
    e.preventDefault();
    const step = new URLSearchParams(location.search).get("step") || "cv";
    got[step] = e.dataTransfer.files[0].name;
    document.getElementById("uploaded").textContent = JSON.stringify(got);
  });
  // ?chakra=1: live join.com (layout report 2026-09-28) renders TWO unnamed
  // uploaders per step, one in a hidden wrapper; only the visible one counts.
  if (new URLSearchParams(location.search).has("chakra")) {
    const hiddenWrap = document.createElement("div");
    hiddenWrap.style.display = "none";
    hiddenWrap.innerHTML = '<div data-part="root"><div data-part="trigger">Upload file</div><input type="file" accept=".pdf" id="hidden-variant"></div>';
    box.before(hiddenWrap);
    const visibleInput = document.createElement("input");
    visibleInput.type = "file"; visibleInput.accept = ".pdf"; visibleInput.id = "shown-variant";
    visibleInput.style.cssText = "position:absolute;width:1px;height:1px;clip:rect(0 0 0 0)";
    box.append(visibleInput);
    const step = () => new URLSearchParams(location.search).get("step") || "cv";
    visibleInput.addEventListener("change", () => {
      got[step()] = visibleInput.files[0].name;
      document.getElementById("uploaded").textContent = JSON.stringify(got);
    });
    document.getElementById("hidden-variant").addEventListener("change", () => { got.wrong = "hidden"; });
  }
  document.getElementById("continue").addEventListener("click", () => {
    const keep = new URLSearchParams(location.search).has("chakra") ? "&chakra=1" : "";
    history.pushState({}, "", location.pathname + "?step=coverLetter" + keep + location.hash);
    document.getElementById("h").textContent = "Upload your cover letter";
  });
</script>
</body></html>
