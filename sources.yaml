  # Two more keyless aggregators. arbeitnow is a European (German-heavy) board
  # where only ~6% of postings are remote and it ignores its own ?remote=true
  # filter, so pages are what buy remote EU hits -- 3 pages is ~400 postings,
  # and Gate 1 drops the onsite majority for free. himalayas caps every
  # request at 20 postings server-side, so `count` is paged 20 at a time.
  - kind: arbeitnow
    pages: 3
  - kind: himalayas
    count: 60
  # Adzuna. Needs ADZUNA_APP_ID + ADZUNA_APP_KEY in .env -- NEVER here; the
  # dispatch reads env only and every entry no-ops with a warning until set.
  # fetch_adzuna supports ten EU markets; four are configured below.
  #
  # MEASURED YIELD, 2026-08-17, of exactly these six entries as written:
  # 8 postings total, 6 of which pass Gate 1. NOT four figures -- the raw
  # `count` numbers that look four-figure come from queries WITHOUT the
  # "remote" term and without max_days_old, and they do not survive either.
  #
  # Why so few: `where` cannot take a work mode (`where=remote` returns
  # count=0, which looks exactly like a dead credential), so "remote" has to
  # go in `query` -- but `query` is a full-text AND, and Adzuna only indexes
  # the 500-char truncated description. Measured cost of that one term:
  #   gb "AI engineer"          7d -> 794   | + " remote" ->   6
  #   gb "content producer"     7d -> 181   | + " remote" ->   0
  #   nl "python developer"     7d ->   5   | + " remote" ->   0
  # Dropping "remote" and letting Gate 1 filter instead was measured too:
  # 205 fetched -> 8 Gate 1 survivors (3.9%), i.e. THE SAME 8. The term buys
  # a 25x smaller fetch for identical survivors, so it stays.
  #
  # The three entries measured at 0 are kept deliberately: they cost no quota
  # and a market that is empty this week is not empty next week. They will
  # each log one "0 postings" warning per scan -- that is the warning working,
  # not a fault.
  #
  # SCORING CAVEAT, measured on 10 real postings: all 10 scored 3/10 with zero
  # variance and 0 cleared the autopilot floor of 6. Adzuna's descriptions are
  # capped at 500 chars server-side (8.3% of the scorer's 6000-char window),
  # which is too little for the scorer to discriminate. As configured, Adzuna
  # feeds /scout for human review but produces no auto-applications.
  - kind: adzuna
    query: "AI engineer remote"
    country: gb
    max_days_old: 7
  - kind: adzuna
    query: "AI engineer remote"
    country: de
    max_days_old: 7
  # measured 0 at both 7d and 30d on 2026-08-17 -- kept, see the note above
  - kind: adzuna
    query: "AI automation engineer remote"
    country: gb
    max_days_old: 7
  # measured 0 at both 7d and 30d on 2026-08-17
  - kind: adzuna
    query: "python developer remote"
    country: nl
    max_days_old: 7
  - kind: adzuna
    query: "python developer remote"
    country: pl
    max_days_old: 7
  # measured 0 at both 7d and 30d on 2026-08-17
  - kind: adzuna
    query: "content producer remote"
    country: gb
    max_days_old: 7
  # JSearch (OpenWebNinja). Needs JSEARCH_API_KEYS in .env -- NEVER here.
  #
  # UK-TARGETED ONLY, and "UK" must be in the query TEXT: measured 2026-08-17,
  # the API's default search context is the US, `country=gb` alone returns 0
  # rows, "python developer remote germany" returns 0, and "AI engineer remote
  # europe" returns US employers. Six keys x 200 req/mo = 1200/mo, so every
  # continental query would be pure waste -- fetch_jsearch refuses any market
  # outside JSEARCH_MARKETS, and data/jsearch_budget.json caps the pool.
  #
  # 6 queries/day = ~186/mo, comfortably under the 600/mo counter.
  #
  # SCORING CAVEAT, measured on 6 real postings 2026-08-17: descriptions here
  # average 3132 chars (6.3x Adzuna's), which does lift scores -- mean 3.7 vs
  # 3.0, with two 5s -- but 0 of 6 cleared the autopilot floor of 6 either.
  # So the shortfall is NOT only Adzuna's truncation: this UK-aggregator
  # channel as a whole currently produces review candidates, not applications.
  - kind: jsearch
    query: "AI engineer remote UK"
  - kind: jsearch
    query: "AI automation engineer remote UK"
  - kind: jsearch
    query: "machine learning engineer remote UK"
  - kind: jsearch
    query: "python developer remote UK"
  - kind: jsearch
    query: "forward deployed engineer remote UK"
  - kind: jsearch
    query: "content producer remote UK"
  # SerpAPI google_jobs rejects continent locations ("Europe") and city locations
  # return 0; rely on the query text + ltype=1 (remote) and let Gate 1 + the LLM
  # enforce EU-eligibility. No `location` param.
  #
  # 5 serpapi queries/day = ~150/mo, which EXCEEDS budget.SerpBudget's 90/mo cap
  # by design -- the counter is what stops serpapi fetches once the month's 90
  # are spent, rather than sources.yaml self-limiting to a number nobody would
  # ever revisit as content-track coverage grows.
  - kind: serpapi
    query: "AI engineer remote europe"
  - kind: serpapi
    query: "AI automation engineer remote europe"
  - kind: serpapi
    query: "forward deployed engineer remote europe"
  - kind: serpapi
    query: "content producer remote part-time"
  - kind: serpapi
    query: "freelance video editor remote europe"
  # LinkedIn. Needs LINKEDIN_API_KEY *and* LINKEDIN_API_URL in .env -- NEVER
  # here. Several services resell LinkedIn job search and they disagree on
  # host, auth header and response envelope, so the provider is configuration:
  #   LINKEDIN_API_KEY=<key>
  #   LINKEDIN_API_URL=https://<provider>/<search-path>
  #   LINKEDIN_API_HEADER=x-api-key   # or Authorization, x-rapidapi-key, ...
  # Until both the key and the URL are set, every entry below no-ops with one
  # warning per scan and costs nothing -- that is the warning working, not a
  # fault. The key alone is not enough: it does not say which host it belongs
  # to, and guessing would send a live credential to the wrong service.
  # SUPERSEDED by the apify_linkedin block below (2026-09-17). Left commented
  # rather than deleted: the generic reseller path still works if a different
  # LinkedIn provider is ever configured. Uncommenting BOTH paths at once would
  # search the same market twice and pay for it twice.
  # - kind: linkedin
  #   query: "AI engineer remote europe"
  # - kind: linkedin
  #   query: "forward deployed engineer remote europe"

  # --- LinkedIn via Apify (kind: apify_linkedin) ----------------------------
  #
  # Actor cheap_scraper/linkedin-job-scraper, FREE $5/month plan. NO CREDENTIAL
  # LIVES HERE (SEC020): run_scan.sh reads APIFY_TOKEN from ~/clawd/.env at run
  # time. OFF unless APIFY_ENABLED=1, so a bare `python scripts/scan.py` never
  # bills.
  #
  # MEASURED on the first real run (2026-09-24, 150 rows): the actor enforces a
  # 150-result floor per run (~$0.11 at $0.0007/result + $0.005 start), every
  # row's applyUrl is the LinkedIn page itself, and ~8% (12/150) resolve through
  # the board probe to an Ashby/Greenhouse/Lever posting Scout can apply to.
  # So LinkedIn is discovery plus a thin apply stream, and a seven-a-day matrix
  # would have cost ~$20/month. Instead: ONE query per weekday, rotating
  # (cadence: weekly + weekday 0=Mon..4=Fri), each looking back 7 days so a
  # week of rotation leaves no gap. ~22 runs, ~$2.40/month.
  #
  # Full-time AI/engineering only (Teodor, 2026-09-17). Placed LAST on purpose:
  # the free harvested boards win Gate 3's in-batch dedup race, so a paid
  # LinkedIn duplicate is the copy dropped.
  - kind: apify_linkedin
    label: "mon-applied-solutions-eu"
    keywords: ["Applied AI Engineer", "AI Solutions Engineer"]
    locations: ["European Union"]
    cadence: "weekly"
    weekday: 0
    published_at: "r604800"
    work_type: ["remote"]
    max_items: 150
    job_title_exclude: ["Sales", "Recruiter", "Account Executive", "Intern"]
  # Romania: the repo's biggest blind spot -- no other source covers it.
  - kind: apify_linkedin
