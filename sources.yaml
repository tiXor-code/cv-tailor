sources:
  - kind: ashby
    slug: xbowcareers
    name: XBow
  - kind: ashby
    slug: constructor
    name: Constructor
  - kind: ashby
    slug: Deel
    name: Deel
  - kind: ashby
    slug: neurons-lab.com
    name: Neurons Lab
  - kind: ashby
    slug: patrianna
    name: Patrianna
  # Curated EU-startup ATS list (replaces the greenhouse:anthropic + lever:lever
  # placeholders -- those were smoke-test entries, not real targets).
  - kind: greenhouse
    slug: gitlab
    name: GitLab
  - kind: greenhouse
    slug: remotecom
    name: Remote.com
  - kind: greenhouse
    slug: canonical
    name: Canonical
  # Free remote-job boards (no API key), one entry per track so both the ai
  # and content tracks (see profile.yaml tracks:) get board coverage.
  - kind: remotive
    category: software-dev
  - kind: remotive
    category: marketing
  - kind: remoteok
    tag: ai
  - kind: remoteok
    tag: marketing
  - kind: jobicy
    count: 30
    tag: software
  - kind: jobicy
    count: 30
    tag: copywriting
  - kind: wwr
    category: programming
  - kind: wwr
    category: sales-and-marketing
  # Two more keyless aggregators. arbeitnow is a European (German-heavy) board
  # where only ~6% of postings are remote and it ignores its own ?remote=true
  # filter, so pages are what buy remote EU hits -- 3 pages is ~400 postings,
  # and Gate 1 drops the onsite majority for free. himalayas caps every
  # request at 20 postings server-side, so `count` is paged 20 at a time.
  - kind: arbeitnow
    pages: 3
  - kind: himalayas
    count: 60
  # Adzuna: the single biggest EU supply source here (a probe on 2026-08-17
  # returned four-figure counts on gb/it, three-figure on de/es/pl). Needs
  # ADZUNA_APP_ID + ADZUNA_APP_KEY in .env -- NEVER here; the dispatch reads
  # env only and every entry no-ops with a warning until they are set.
  #
  # `where` is deliberately absent from every entry: it expects a PLACE, and
  # `where=remote` returns count=0, which looks exactly like a dead
  # credential. The work mode belongs in `query` (Adzuna ANDs the terms).
  # max_days_old keeps a daily scan on NEW postings -- unsorted results run
  # back nine months.
  - kind: adzuna
    query: "AI engineer remote"
    country: gb
    max_days_old: 7
  - kind: adzuna
    query: "AI engineer remote"
    country: de
    max_days_old: 7
  - kind: adzuna
    query: "AI automation engineer remote"
    country: gb
    max_days_old: 7
  - kind: adzuna
    query: "python developer remote"
    country: nl
    max_days_old: 7
  - kind: adzuna
    query: "python developer remote"
    country: pl
    max_days_old: 7
  - kind: adzuna
    query: "content producer remote"
    country: gb
    max_days_old: 7
  # SerpAPI google_jobs rejects continent locations ("Europe") and city locations
  # return 0; rely on the query text + ltype=1 (remote) and let Gate 1 + the LLM
  # enforce EU-eligibility. No `location` param.
  #
  # 5 serpapi queries/day = ~150/mo, which EXCEEDS budget.SerpBudget's 90/mo cap
  # by design -- the counter is what stops serpapi fetches once the month's 90
  # are spent, rather than sources.yaml self-limiting to a number nobody would
  # ever revisit as content-track coverage grows.
  - kind: serpapi
    query: "AI engineer remote europe"
  - kind: serpapi
    query: "AI automation engineer remote europe"
  - kind: serpapi
    query: "forward deployed engineer remote europe"
  - kind: serpapi
    query: "content producer remote part-time"
  - kind: serpapi
    query: "freelance video editor remote europe"
