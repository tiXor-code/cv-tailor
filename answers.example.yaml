# Copy this file to answers.yaml and fill in your real values.
# answers.yaml is gitignored and must never be committed.
salary_fulltime_gross_eur_month: 4000
salary_fulltime_net_eur_month: "2000-2400"
hourly_rate_min_eur: 25
availability_parttime: "Tuesday and Thursday evenings"
work_authorization: >-
  EU citizen (example). Can work as an employee for any company hiring in the
  EU, or as an independent contractor.
notice_period: "30 calendar days"
relocation: "Not open to relocation; remote only (example)."
links:
  website: "https://example.com"
  linkedin: "https://linkedin.com/in/example"
  github: "https://github.com/example"

# Optional -- not in REQUIRED_KEYS, only used by portals that ask these
# specific questions (e.g. micro1's post-Next "start/rate/hours" step).
start_availability_days: 14

# Screening questions that blocked real applications until they were answered.
# how_heard must match a dropdown option on most forms ("Job board",
# "Company website", "LinkedIn", "Other").
how_heard: "Job board"
# A factual claim on a real application -- never inferred from the CV.
years_experience: 5
# Structured, so a rule can answer YES for a language you speak and NO for one
# you do not. A blanket "No" would reject every English-language posting via
# its own screening question.
languages_spoken:
  - English
open_to_travel: false
# Timezones whose business hours you can actually cover. Structured for the
# same reason as languages_spoken: "yes to GMT" is not "yes to any hours
# question" -- US Pacific business hours from Europe would be 19:00-04:00, and
# answering Yes there submits a commitment you cannot keep.
timezone_overlap_ok:
  - GMT
  - CET
hourly_rate_ask_usd: 25
hours_per_week_available: 10
# Distinct from regular travel for the job itself: a one-off interview trip.
in_person_interview: false
